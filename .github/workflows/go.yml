name: Go

on:
  workflow_dispatch:
  push:
    branches: [ "master", "release/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.13.1
  MOCKGEN_VERSION: v0.6.0

jobs:
  check:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            go: 1.27.0
          - os: ubuntu-latest
            go: 1.27.1
          - os: macos-latest
            go: 1.27.1
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Install development tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          go install go.uber.org/mock/mockgen@${MOCKGEN_VERSION}

      - name: Run complete repository gate
        run: make check

      - name: Verify generated and formatted files are committed
        run: |
          go generate ./...
          git diff --exit-code

  release-consumer:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test published release consumer
        run: make test-consumer-release VERSION="${GITHUB_REF_NAME}"

